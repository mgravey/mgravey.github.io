name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["jeykill-version"]
  pull_request:
    branches: ["jeykill-version"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Validate authoritative content
        run: npm run validate

      - name: Generate optimized assets
        run: npm run prepare:site

      - name: Build with Jekyll
        run: bundle exec jekyll build --strict_front_matter --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Validate generated HTML
        run: bundle exec htmlproofer ./_site --disable-external --allow-hash-href

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/jeykill-version'
        uses: actions/upload-pages-artifact@v4

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/jeykill-version'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
