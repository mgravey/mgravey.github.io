title: "Mathieu Gravey"
description: "Personal website of a scientific researcher"
url: "https://mgravey.github.io"
baseurl: ""
permalink: pretty
timezone: Europe/Paris

# Author info
author_name: "Mathieu"
author_last: "Gravey"

# Appearance (CSS variables are in assets/css/main.scss)
theme:
  accent: "#4fb0ff"
  accent2: "#00d1b2"
  bg: "#0b0f14"
  text: "#e6e9ef"
  muted: "#a5b0c2"

# Default background image fallback
default_bg: "/assets/img/background/starSky.jpg"

# Jekyll settings
markdown: kramdown
highlighter: rouge
sass:
  style: compressed

collections:
  posts:
    output: true

plugins:
  - jekyll-feed

# Social links (fill as needed)
twitter: "https://twitter.com/mathieuGravey"
researchgate: "https://www.researchgate.net/profile/Mathieu-Gravey"
google_scholar: "https://www.mgravey.com/#googlescholar"
github: "https://github.com/mgravey"

exclude:
  - node_modules
  - vendor
  - README.md
  - Gemfile*
  - package*.json
  - .github
