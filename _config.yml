title: "Mathieu Gravey"
description: "Researcher in geoscience, remote sensing, geostatistics, and scientific computing."
# Used by jekyll-seo-tag for the homepage <title>: "Mathieu Gravey | <tagline>"
tagline: "Researcher in Geoscience, Remote Sensing & Geostatistics"
url: "https://mgravey.com"
baseurl: ""
permalink: pretty
timezone: Europe/Vienna
lang: en

# Appearance (CSS variables are in assets/css/main.scss)
palette:
  accent: "#4fb0ff"
  accent2: "#00d1b2"
  bg: "#0b0f14"
  text: "#e6e9ef"
  muted: "#a5b0c2"

# Default background image fallback
default_bg: "/assets/generated/background/starSky.webp"

transition:
  effect: fade
  duration_ms: 320

# Jekyll settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
sass:
  style: compressed

collections:
  posts:
    output: true

plugins:
  - jekyll-seo-tag

exclude:
  - node_modules
  - vendor
  - README.md
  - CHANGES.md
  - Gemfile*
  - package*.json
  - .github
  - tests
  - playwright.config.js
  - scripts
  - assets/source-images
  - viewpoints
