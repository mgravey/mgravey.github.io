<!doctype html>
<html class="no-js" lang="{{ site.lang | default: 'en' }}" data-transition="{{ site.transition.effect }}" data-transition-duration="{{ site.transition.duration_ms }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>document.documentElement.classList.remove("no-js");</script>
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    {% include head-extra.html %}
  </head>
  <body data-barba="wrapper">
    <a class="skip-link" href="#main">Skip to main content</a>
    {% include header.html %}
    <div class="bg-layer bg-a is-active" aria-hidden="true" style="--bg-image: url('{{ page.bg_image | default: site.default_bg }}')"></div>
    <div class="bg-layer bg-b" aria-hidden="true" style="--bg-image: url('{{ page.bg_image | default: site.default_bg }}')"></div>
    <main id="main" tabindex="-1" data-barba="container" data-barba-namespace="{{ page.title | slugify | default: 'page' }}" data-bg="{{ page.bg_image | default: site.default_bg }}">
      <div class="container">
        {{ content }}
      </div>
    </main>
    {% include footer.html %}

    <script id="survey-config" type="application/json">{{ site.data.survey | jsonify }}</script>
    <script id="contact-config" type="application/json">{{ site.data.person.contact | jsonify }}</script>
    <script defer src="{{ '/assets/dist/site.js' | relative_url }}"></script>
  </body>
</html>
