---
layout: default
---
<section class="page-header">
  <h1 class="page-title" id="page-title">{{ page.heading | default: page.title }}</h1>
  {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
</section>

<section class="page-content {{ page.page_class }}">
  {{ content }}
</section>
