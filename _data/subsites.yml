# Independent GitHub Pages sites served under mgravey.com/<repo>/.
# At build time, _plugins/subsites.rb reads each live site: its sitemap.xml (if
# present, added to the /sitemap.xml index; otherwise `url` is listed in
# /sitemap-pages.xml), Last-Modified date, meta description and llms.txt.
# Nothing here has to change when a sub-site evolves; rebuild this site to
# pick it up. Any of `sitemap`, `lastmod`, `description`, `llms` set here wins.
