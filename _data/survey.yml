endpoint: "https://geohub.mgravey.com/survey"
storage_key: "mg_email_gate_v1"
title: "One Tiny Checkpoint"
description: "Please answer a few quick questions before email addresses are unlocked."
complete_message: "Thanks. Email links are now unlocked on this browser."

questions:
  - id: 1
    type: choice
    prompt: "What is worse: a research that ignores how means (average) work, or believing the Earth is flat?"
    answers:
      - id: 1
        label: "mean"
      - id: 2
        label: "flat earth"

